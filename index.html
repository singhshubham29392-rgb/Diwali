<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Happy Diwali Celebration 🎆</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ✨ Rainbow Twinkling Lights Row -->
<div style="position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-around;z-index:4;padding:10px;">
  <div class="light-bulb" style="animation-delay:0s;"></div>
  <div class="light-bulb" style="animation-delay:0.3s;"></div>
  <div class="light-bulb" style="animation-delay:0.6s;"></div>
  <div class="light-bulb" style="animation-delay:0.9s;"></div>
  <div class="light-bulb" style="animation-delay:1.2s;"></div>
  <div class="light-bulb" style="animation-delay:1.5s;"></div>
  <div class="light-bulb" style="animation-delay:1.8s;"></div>
  <div class="light-bulb" style="animation-delay:2.1s;"></div>
</div>

<div class="wrap">
  <div class="card">
    <h1>🎇 Happy Diwali🎆</h1>
    <p>Diwali is a celebration of light, love, and laughter. May it bring joy and happiness to your life</p>
    <div id="countdown">Loading...</div>
    <canvas id="fireworksCanvas" aria-label="Fireworks display"></canvas>
    <div style="margin-top:15px;">
      <button class="btn" id="launchBurst">Launch Fireworks</button>
      <button class="btn" id="autoCrackers">Auto Crackers: OFF</button>
      <button class="btn" id="toggleMusic">Play Music</button>
      <button class="btn" id="shareBtn">Share 🎉</button>
    </div>
  </div>
</div>
<div id="celebrationBanner">🎆 Happy Diwali! 🪔</div>

  <!-- 🪔 Side Diyas -->
<div class="side-diyas">
  <div class="diya"><div class="flame"></div></div>
  <div class="diya"><div class="flame"></div></div>
</div>
<script src="script.js"></script>
</body>
</html>
