<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Happy Diwali Celebration 🎆</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 🌟 Top Decorative Lights -->
<div class="light-string">
  <div class="light"></div><div class="light"></div><div class="light"></div>
  <div class="light"></div><div class="light"></div><div class="light"></div>
  <div class="light"></div><div class="light"></div><div class="light"></div>
</div>

<!-- 🪔 Side Diyas -->
<div class="side-diyas">
  <div class="diya"><div class="flame"></div></div>
  <div class="diya"><div class="flame"></div></div>
</div>

<div class="wrap">
  <div class="card">
    <h1>🎇 Diwali Countdown 🎆</h1>
    <p>Get ready for the grand celebration!</p>
    <div id="countdown">Loading...</div>
    <canvas id="fireworksCanvas"></canvas>
    <div style="margin-top:15px;">
      <button class="btn" id="launchBurst">Launch Fireworks</button>
      <button class="btn" id="autoFireworks">Auto Fireworks: Off</button>
      <button class="btn" id="toggleMusic">Play Music</button>
      <button class="btn" id="shareBtn">Share 🎉</button>
    </div>
  </div>
</div>

<!-- ✨ Celebration Banner with Diyas -->
<div id="celebrationBanner">
  <img src="https://cdn-icons-png.flaticon.com/512/2965/2965567.png" class="diya-img left-diya" alt="Diya">
  <span>🎆 Happy Diwali! 🎇</span>
  <img src="https://cdn-icons-png.flaticon.com/512/2965/2965567.png" class="diya-img right-diya" alt="Diya">
</div>
<script src="script.js"></script>
</body>
</html>
