<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Happy Diwali 🎆</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🎇Happy Diwali 🎆</h1>
      <p>Get ready for the grand celebration!</p>
      <div id="countdown">Loading...</div>
      <canvas id="fireworksCanvas"></canvas>

        <button class="btn" id="launchBurst">Launch Fireworks</button>
        <button class="btn" id="toggleMusic">Play Music</button>
      </div>
    </div>
  </div>
  <div id="celebrationBanner">🎆 Happy Diwali! 🪔</div>
<script src="script.js"></script>
</body>
</html>
