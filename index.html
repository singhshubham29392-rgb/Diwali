<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Happy Diwali Celebration 🎆</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 💡 Diwali Lights -->
<div class="light-string">
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
</div>
<div class="wrap">
  <div class="card">
    <h1>🎇 Happy Diwali🎆</h1>
    <p>Diwali is a celebration of light, love, and laughter. May it bring joy and happiness to your life</p>
    <div id="countdown">Loading...</div>
    <canvas id="fireworksCanvas" aria-label="Fireworks display"></canvas>
    <div style="margin-top:15px;">
      <button class="btn" id="launchBurst">Launch Fireworks</button>
      <button class="btn" id="autoCrackers">Auto Crackers: OFF</button>
      <button class="btn" id="toggleMusic">Play Music</button>
      <button class="btn" id="shareBtn">Share 🎉</button>
    </div>
  </div>
</div>
<div id="celebrationBanner">🎆 Happy Diwali! 🪔</div>

  <!-- 🪔 Side Diyas -->
<div class="side-diyas">
  <div class="diya"><div class="flame"></div></div>
  <div class="diya"><div class="flame"></div></div>
</div>
<script src="script.js"></script>
</body>
</html>
